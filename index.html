<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Kessler Reach — a free browser skilling RPG in a 3D open world. Salvage, craft, fight and fly across a shattered frontier star system.">
<meta property="og:title" content="KESSLER REACH — frontier skilling RPG">
<meta property="og:description" content="A free browser RPG in a 3D open world: 15 skills, 13 missions, 5 settlements, living world events. No install — click and play.">
<meta property="og:url" content="https://stobieee-bit.github.io/kessler-reach/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0a0f18">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>KESSLER REACH — frontier skilling RPG</title>
<link rel="stylesheet" href="css/style.css?v=213">
</head>
<body>
<div id="boot"><div class="boot-t">KESSLER <span>REACH</span></div><div class="boot-sub">waking the Reach…</div></div>
<div id="app">

  <header id="topbar">
    <div class="brand" title="Kessler Reach"><span class="brand-a">KESSLER</span><span class="brand-b">REACH</span></div>
    <div class="top-id" id="topCallsign"></div>
    <div class="top-stat credits" title="Credits"><span class="cr-glyph">⬡</span><span id="topCredits">0</span><span class="cr-suffix">cr</span></div>
    <div class="top-hp" title="Hull integrity (your health)">
      <div class="hpbar"><div class="hpfill" id="topHpFill"></div><span class="hptext" id="topHpText"></span></div>
    </div>
    <div class="top-zone" id="topZone"></div>
    <div class="top-buffs" id="topBuffs"></div>
    <div class="top-icons">
      <button id="btnHelp" class="icon-btn" title="Help & about (H)">?</button>
      <button id="btnSound" class="icon-btn" title="Toggle sound">♪</button>
      <button id="btnSettings" class="icon-btn" title="Settings / Save">⚙</button>
    </div>
  </header>

  <aside id="skillbar">
    <div class="panel-head">SKILLS<span class="panel-sub" id="totalLevel"></span></div>
    <div id="skillList"></div>
  </aside>

  <main id="main">
    <div id="viewport">
      <canvas id="gl"></canvas>
      <div id="labels"></div>
      <div id="regionFade"></div>
      <div id="hint"></div>
      <canvas id="hudmap" width="148" height="148" title="Local scan — click for system map"></canvas>
      <div id="tracker"></div>
      <button id="specBtn" title="Special attack (Space) — charges as you fight"><i></i><span id="specLabel">SPECIAL</span><b id="specPct">0%</b></button>
      <div id="floatPanel" class="hidden"></div>
    </div>
  </main>

  <aside id="side">
    <nav id="sideTabs" class="tabs"></nav>
    <div id="sideContent" class="scrolly"></div>
  </aside>

  <footer id="logbar"></footer>
</div>

<div id="toasts"></div>
<div id="modalRoot"></div>

<script src="lib/three.min.js"></script>
<script src="js/data.js?v=213"></script>
<script src="js/world.js?v=213"></script>
<script src="js/game.js?v=213"></script>
</body>
</html>
